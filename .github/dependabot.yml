version: 2
updates:
  # Les correctifs de sécurité GitHub ciblent uniquement la branche par défaut.
  # Une limite de zéro désactive les PR de version, pas les PR de sécurité.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  # Les mises à jour régulières suivent le flux d'intégration du projet.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Europe/Paris
    target-branch: develop
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 (native compiler) has no JS API yet: typescript-eslint and
      # @astrojs/check only support up to 6.x. Revisit when they add 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      tooling-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Europe/Paris
    target-branch: develop
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Europe/Paris
    target-branch: develop
    open-pull-requests-limit: 2
