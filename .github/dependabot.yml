version: 2
updates:
  # Les correctifs de sécurité GitHub ciblent uniquement la branche par défaut.
  # Une limite de zéro désactive les PR de version, pas les PR de sécurité.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  # Les mises à jour régulières suivent le flux d'intégration du projet.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Europe/Paris
    target-branch: develop
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 (native compiler) has no JS API yet: typescript-eslint and
      # @astrojs/check only support up to 6.x. Revisit when they add 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @astrojs/react (<= 7.1.2) declares oxc-transform-react ^0.145.0 while
      # @vitejs/plugin-react >= 6.1.2 requires ^0.152.0, so bumping either side
      # breaks the Docker npm prune with ERESOLVE (#41, #81). Revisit when
      # @astrojs/react accepts a newer oxc-transform-react.
      - dependency-name: oxc-transform-react
        versions: [">=0.146.0"]
      - dependency-name: "@vitejs/plugin-react"
        versions: [">=6.1.2"]
      - dependency-name: "@astrojs/react"
        versions: [">=7.1.1"]
    groups:
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      tooling-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Europe/Paris
    target-branch: develop
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Europe/Paris
    target-branch: develop
    open-pull-requests-limit: 2
