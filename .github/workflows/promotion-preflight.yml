name: CD — contrôle préalable de promotion (sans déploiement)
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: ID du run CI réussi contenant le candidat testé
        required: true
        type: string
      candidate_sha:
        description: SHA exact du candidat attendu (40 caractères)
        required: true
        type: string
      target:
        description: Environnement futur
        required: true
        type: choice
        options: [preproduction, production]
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Validate candidate source and download exact artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          TARGET: ${{ inputs.target }}
        run: |
          [[ "$CANDIDATE_RUN" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GH_REPO/actions/runs/$CANDIDATE_RUN" > run.json
          node scripts/candidate.mjs --run-only run.json "$TARGET" "$CANDIDATE_SHA"
          gh run download "$CANDIDATE_RUN" -n "candidate-$CANDIDATE_SHA" -D candidate
          node scripts/candidate.mjs candidate run.json "$TARGET" "$CANDIDATE_SHA"
          printf 'Candidat vérifié : %s pour %s.\n\n' "$CANDIDATE_SHA" "$TARGET" >> "$GITHUB_STEP_SUMMARY"
          printf 'Aucun déploiement exécuté. Infrastructure, secrets, migrations verrouillées, contrôles de santé et reprise restent à configurer au lot livraison.\n' >> "$GITHUB_STEP_SUMMARY"
